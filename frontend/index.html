<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG · Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="titleblock">
        <span class="titleblock__mark">RAG·CHAT</span>
        <span class="titleblock__meta">Document Q&amp;A · Powabase</span>
      </header>

      <section class="panel" aria-labelledby="upload-heading">
        <h2 class="eyebrow" id="upload-heading"><span class="eyebrow__num">§01</span> Source</h2>
        <div class="upload-row">
          <input type="file" id="file-input" accept="application/pdf" aria-label="Choose a PDF file" />
          <button id="upload-button" class="btn">Upload</button>
        </div>
        <p id="upload-status" class="status" aria-live="polite"></p>
      </section>

      <section class="panel" aria-labelledby="chat-heading">
        <h2 class="eyebrow" id="chat-heading"><span class="eyebrow__num">§02</span> Query</h2>
        <div id="messages" aria-live="polite"></div>
        <form id="chat-form">
          <input
            type="text"
            id="chat-input"
            placeholder="Ask a question about the source…"
            aria-label="Ask a question about the source"
            autocomplete="off"
          />
          <button type="submit" class="btn btn--accent">Send</button>
        </form>
      </section>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
