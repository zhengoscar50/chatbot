<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Chat</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("rag-chat-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="auth-gate" id="auth-gate">
      <form class="auth-card" id="auth-form">
        <h1 class="auth-card__title">RAG Chat</h1>
        <p class="auth-card__mode" id="auth-mode-label">Log in to continue</p>
        <input id="auth-username" class="auth-input" placeholder="Username" autocomplete="username" />
        <input id="auth-password" type="password" class="auth-input" placeholder="Password (8+ characters)" autocomplete="current-password" />
        <input id="auth-invite" class="auth-input" placeholder="Invite code" autocomplete="off" hidden />
        <button type="submit" id="auth-submit" class="auth-submit">Log in</button>
        <p class="auth-error" id="auth-error"></p>
        <button type="button" id="auth-toggle" class="auth-toggle">Need an account? Register</button>
      </form>
    </div>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__head">
          <span class="sidebar__user" id="current-user"></span>
          <button type="button" id="logout-btn" class="logout-btn">Log out</button>
        </div>
        <button type="button" id="manage-agents" class="new-session">⚙ Manage agents</button>
        <button id="new-session" class="new-session" disabled>+ New chat</button>
        <ul class="session-list" id="session-list" aria-label="Chats"></ul>
        <p class="sidebar__status" id="sidebar-status"></p>
        <a class="admin-link" href="/admin">Admin</a>
      </aside>

      <div class="main">
        <header class="topbar">
          <button id="sidebar-toggle" class="icon-btn topbar__toggle" aria-label="Toggle sessions">☰</button>
          <span class="topbar__mark" aria-hidden="true"></span>
          <span class="topbar__title" id="active-title">RAG Chat</span>
          <button type="button" id="theme-toggle" class="icon-btn topbar__theme" aria-label="Toggle dark mode" title="Toggle theme">
            <svg class="theme-ico theme-ico--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
            <svg class="theme-ico theme-ico--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
          </button>
        </header>

        <main class="thread" id="messages" aria-live="polite">
          <div class="empty-state" id="empty-state">Pick or create a session to start.</div>
        </main>

        <footer class="composer-wrap">
          <div class="attachment-chip" id="attachment-chip" hidden>
            <span id="attachment-name"></span>
            <span class="attachment-chip__status" id="attachment-status"></span>
          </div>
          <form id="chat-form" class="composer">
            <button type="button" id="attach-button" class="icon-btn" aria-label="Attach a PDF" title="Attach a PDF">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48" />
              </svg>
            </button>
            <input type="file" id="file-input" accept="application/pdf" hidden />
            <input
              type="text"
              id="chat-input"
              class="composer__input"
              placeholder="Ask a question about this session's documents…"
              aria-label="Message"
              autocomplete="off"
            />
            <button type="submit" id="send-button" class="icon-btn icon-btn--accent" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
            </button>
          </form>
        </footer>
      </div>
    </div>
    <div id="agent-list-modal" class="modal" hidden>
      <div class="modal-card">
        <h2>Your agents</h2>
        <p class="muted">The orchestrator picks one per message, using these descriptions.</p>
        <ul id="agent-list"></ul>
        <div class="modal-actions">
          <button type="button" id="agent-list-close">Close</button>
          <button type="button" id="agent-list-new">New agent</button>
        </div>
      </div>
    </div>

    <div id="agent-modal" class="modal" hidden>
      <form id="agent-form" class="modal-card">
        <h2 id="agent-modal-title">New agent</h2>
        <label>Name
          <input id="agent-name" required maxlength="80" placeholder="Chemistry tutor" />
        </label>
        <label>What is this for?
          <input id="agent-description" maxlength="500"
                 placeholder="Answers questions about our AP Chemistry course materials." />
        </label>
        <label>Instructions
          <textarea id="agent-instructions" rows="5"
            placeholder="You are a study tutor for AP Chemistry. Always show your working."></textarea>
        </label>
        <label>Model
          <select id="agent-model-select"></select>
        </label>
        <label id="agent-model-custom-row" hidden>Model id
          <input id="agent-model" placeholder="e.g. openrouter/meta-llama/llama-3.3-70b-instruct" />
        </label>
        <label>Grounding
          <select id="agent-grounding">
            <option value="strict">Only answer from my documents</option>
            <option value="open">Use my documents, but answer freely</option>
          </select>
        </label>
        <label class="checkbox">
          <input type="checkbox" id="agent-general-kb" /> Also use shared general knowledge
        </label>
        <div id="agent-docs" hidden>
          <h3>Trained on</h3>
          <ul id="agent-doc-list"></ul>
          <label class="train-row">Add a document
            <input type="file" id="agent-train-file" accept="application/pdf" />
          </label>
          <p id="agent-train-status" class="train-status"></p>
        </div>
        <p id="agent-error" class="auth-error"></p>
        <div class="modal-actions">
          <button type="button" id="agent-delete" class="danger" hidden>Delete agent</button>
          <button type="button" id="agent-cancel">Cancel</button>
          <button type="submit" id="agent-save">Save</button>
        </div>
      </form>
    </div>

    <script src="/theme.js"></script>
    <script src="/agents.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
