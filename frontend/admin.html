<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <link rel="stylesheet" href="/styles.css" />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("rag-chat-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="admin-page">
      <header class="admin-head">
        <span class="topbar__mark" aria-hidden="true"></span>
        <h1 class="admin-title">Admin</h1>
        <a class="admin-back" href="/">← Back to chat</a>
        <button type="button" id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="theme-ico theme-ico--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" /></svg>
          <svg class="theme-ico theme-ico--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>
        </button>
      </header>

      <section class="admin-card" id="gate">
        <p class="admin-hint">Enter the admin password to manage user accounts.</p>
        <form id="gate-form" class="admin-row">
          <input type="password" id="password-input" class="admin-input" placeholder="Admin password" autocomplete="current-password" />
          <button type="submit" class="btn-solid">Unlock</button>
        </form>
        <p class="admin-status" id="gate-status"></p>
      </section>

      <section class="admin-card" id="users-panel" hidden>
        <div class="admin-row admin-row--between">
          <p class="admin-hint">Manage user accounts. Passwords can be reset, never viewed.</p>
          <button type="button" id="users-refresh" class="btn-solid">Refresh</button>
        </div>
        <div id="users-table"></div>
        <p class="admin-status" id="users-status"></p>
      </section>
    </div>
    <script src="/theme.js"></script>
    <script src="/admin.js"></script>
  </body>
</html>
